version: '3.8'

services:
  awsan-6g-ntn:
    build: .
    container_name: awsan-6g-core-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PROTOCOL_STANDARD=RFC-AWSAN-6G-NTN-0001
      - CHIEF_ARCHITECT=Eng. Awsan Adel Abdulbari Ahmed Sultan
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/ntn/status"]
      interval: 30s
      timeout: 10s
      retries: 3
